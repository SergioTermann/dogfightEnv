<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">dogfightEnv system architecture</title>
  <desc id="desc">Architecture showing simulation core, network gateway, reinforcement learning clients, LLM commander and human operator.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12283b"/><stop offset="1" stop-color="#0b1c2b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020a12" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#72d3e8"/></marker></defs>
  <rect width="1400" height="620" fill="#071522"/><path d="M0 48H1400M0 570H1400" stroke="#2e6276" stroke-opacity=".35"/><text x="70" y="88" fill="#85d9e6" font-family="Segoe UI,Arial" font-size="18" letter-spacing="3">RUNTIME TOPOLOGY</text><text x="70" y="124" fill="#d6edf1" font-family="Segoe UI,Arial" font-size="34" font-weight="700">One simulation core, multiple decision surfaces</text>
  <g font-family="Segoe UI,Arial" filter="url(#shadow)"><g transform="translate(82 210)"><rect width="250" height="180" rx="8" fill="url(#panel)" stroke="#3e7790"/><text x="22" y="38" fill="#74d7e8" font-size="13" letter-spacing="2">CONTROL SURFACES</text><text x="22" y="78" fill="#e0f3f5" font-size="24" font-weight="700">RL clients</text><text x="22" y="112" fill="#9ebbc5" font-size="16">Gym-style API</text><text x="22" y="140" fill="#9ebbc5" font-size="16">PPO · SAC · Rainbow</text><text x="22" y="168" fill="#65d9c4" font-size="13">obs → action → reward</text></g><g transform="translate(82 430)"><rect width="250" height="110" rx="8" fill="url(#panel)" stroke="#3e7790"/><text x="22" y="38" fill="#74d7e8" font-size="13" letter-spacing="2">HUMAN LOOP</text><text x="22" y="76" fill="#e0f3f5" font-size="22" font-weight="700">Keyboard / Xbox</text><text x="22" y="98" fill="#9ebbc5" font-size="14">Expert demonstrations</text></g><g transform="translate(465 180)"><rect width="410" height="300" rx="10" fill="#102f43" stroke="#65c9d9" stroke-width="2"/><text x="28" y="48" fill="#f1b35d" font-size="13" letter-spacing="2">SIMULATION CORE</text><text x="28" y="95" fill="#f1f8fa" font-size="30" font-weight="700">Harfang3D + JSBSim</text><text x="28" y="136" fill="#b8d4dc" font-size="16">60 Hz deterministic flight loop</text><text x="28" y="170" fill="#b8d4dc" font-size="16">F-16 aerodynamic model</text><text x="28" y="204" fill="#b8d4dc" font-size="16">Missiles · sensors · world state</text><path d="M28 236H382" stroke="#3d6f7e"/><text x="28" y="266" fill="#65d9c4" font-family="Consolas,monospace" font-size="14">HOST : 50888 / JSON over TCP</text></g><g transform="translate(1000 180)"><rect width="320" height="145" rx="8" fill="url(#panel)" stroke="#3e7790"/><text x="22" y="38" fill="#74d7e8" font-size="13" letter-spacing="2">COMMAND LAYER</text><text x="22" y="76" fill="#e0f3f5" font-size="24" font-weight="700">LLM commander</text><text x="22" y="110" fill="#9ebbc5" font-size="15">Rule engine or OpenAI-compatible API</text><text x="22" y="132" fill="#65d9c4" font-size="13">engage · patrol · retreat · hold</text></g><g transform="translate(1000 365)"><rect width="320" height="115" rx="8" fill="url(#panel)" stroke="#3e7790"/><text x="22" y="38" fill="#74d7e8" font-size="13" letter-spacing="2">OBSERVABILITY</text><text x="22" y="76" fill="#e0f3f5" font-size="22" font-weight="700">Telemetry &amp; replay</text><text x="22" y="100" fill="#9ebbc5" font-size="14">Trajectories · logs · ACMI</text></g></g>
  <g fill="none" stroke="#72d3e8" stroke-width="2" marker-end="url(#arrow)"><path d="M332 295H460"/><path d="M332 485H410V420H460"/><path d="M875 260H995"/><path d="M875 405H995"/><path d="M1000 252H910V300H878"/></g><g font-family="Consolas,monospace" font-size="12" fill="#84bac8"><text x="365" y="278">TCP / JSON</text><text x="364" y="468">actions</text><text x="910" y="245">state</text><text x="910" y="390">events</text></g>
</svg>
