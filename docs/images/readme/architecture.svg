<text x="48" y="910" font-size="21" fill="#59696F" font-weight="400">Checkpoints + metrics</text>
<text x="480" y="876" font-size="23" fill="#B45C37" font-weight="700">Commander</text>
<text x="480" y="910" font-size="21" fill="#59696F" font-weight="400">Decision log (JSONL)</text>
<text x="900" y="876" font-size="23" fill="#2361AC" font-weight="700">Environment</text>
<text x="900" y="910" font-size="21" fill="#59696F" font-weight="400">Tacview ACMI (1v1)</text>
</g></svg>