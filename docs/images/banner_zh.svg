<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#131f38"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1600" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1600" height="420" fill="url(#bg)"/>

    <!-- radar rings, bottom-left -->
    <g stroke="#4da3ff" fill="none" opacity="0.13">
      <circle cx="150" cy="432" r="55" stroke-width="1.5"/>
      <circle cx="150" cy="432" r="105" stroke-width="1.5"/>
      <circle cx="150" cy="432" r="155" stroke-width="1.5"/>
      <line x1="150" y1="277" x2="150" y2="420" stroke-width="1"/>
      <line x1="-5" y1="432" x2="305" y2="432" stroke-width="1"/>
    </g>

    <!-- hostile: dashed trail + dart -->
    <path d="M 1585 78 L 1420 108 L 1448 140" stroke="#ff5c5c" stroke-width="2.5" fill="none" stroke-dasharray="10 8" opacity="0.8"/>
    <g transform="translate(1442,128) rotate(188) scale(0.6)" opacity="0.9">
      <path d="M22,0 L2,-4 L-8,-4 L-22,-15 L-26,-14 L-16,-3 L-24,-2 L-30,-6 L-33,-5 L-27,0 L-33,5 L-30,6 L-24,2 L-16,3 L-26,14 L-22,15 L-8,4 L2,4 Z" fill="#ff6b6b"/>
    </g>

    <!-- friendly predicted path + jet -->
    <polyline points="60,398 300,388 560,372 820,350 1120,300 1400,235 1468,214" stroke="#35d07f" stroke-width="3" fill="none" opacity="0.9"/>
    <g stroke="#35d07f" stroke-width="2.5" opacity="0.95">
      <line x1="510" y1="378" x2="534" y2="378"/><line x1="522" y1="366" x2="522" y2="390"/>
      <line x1="1240" y1="262" x2="1264" y2="262"/><line x1="1252" y1="250" x2="1252" y2="274"/>
    </g>
    <text x="522" y="410" font-size="17" fill="#35d07f" text-anchor="middle" opacity="0.9">+5s</text>
    <text x="1252" y="240" font-size="17" fill="#35d07f" text-anchor="middle" opacity="0.9">+10s</text>
    <g transform="translate(1492,204) rotate(-8)">
      <path d="M22,0 L2,-4 L-8,-4 L-22,-15 L-26,-14 L-16,-3 L-24,-2 L-30,-6 L-33,-5 L-27,0 L-33,5 L-30,6 L-24,2 L-16,3 L-26,14 L-22,15 L-8,4 L2,4 Z" fill="#dfe9ff"/>
    </g>

    <!-- wordmark -->
    <text x="800" y="150" font-size="96" font-weight="800" fill="#f2f6ff" text-anchor="middle" letter-spacing="2">dogfightEnv</text>
    <text x="800" y="222" font-size="29" fill="#8fa5c9" text-anchor="middle">基于 Harfang3D 空战沙盒的强化学习仿真环境</text>

    <!-- feature pills -->
    <rect x="446" y="316" width="270" height="44" rx="22" fill="#16233f" stroke="#4da3ff" stroke-width="1.5"/>
    <text x="581" y="345" font-size="22" fill="#6cb2ff" text-anchor="middle">JSBSim 六自由度物理</text>
    <rect x="740" y="316" width="210" height="44" rx="22" fill="#16233f" stroke="#35d07f" stroke-width="1.5"/>
    <text x="845" y="345" font-size="22" fill="#4fd89a" text-anchor="middle">LLM 任务指挥官</text>
    <rect x="974" y="316" width="180" height="44" rx="22" fill="#16233f" stroke="#b78bff" stroke-width="1.5"/>
    <text x="1064" y="345" font-size="22" fill="#c9a2ff" text-anchor="middle">未来轨迹预测</text>

    <!-- card border -->
    <rect x="1" y="1" width="1598" height="418" rx="27" fill="none" stroke="#2c3e63" stroke-width="2"/>
  </g>
</svg>
